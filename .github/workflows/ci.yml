name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Type-check is informational only: the codebase has pre-existing errors.
      # Do not delete this step; it tracks the error count over time.
      - name: Type-check (non-blocking)
        continue-on-error: true
        run: bun run astro check

      - name: Build
        run: bun run build
